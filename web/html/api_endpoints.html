<style>
  /* Sinhala font fix - ensure Vazirmatn font is applied */
  .api-endpoints-page {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Vazirmatn', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  }

  .api-endpoints-page .ant-card,
  .api-endpoints-page .ant-table,
  .api-endpoints-page .ant-alert,
  .api-endpoints-page .ant-tag {
    font-family: inherit;
  }

  /* Ensure dark mode compatibility */
  .dark .ant-card {
    background-color: var(--dark-color-surface-100);
    border-color: var(--dark-color-surface-400);
  }

  .dark .ant-card-head {
    border-bottom-color: var(--dark-color-surface-400);
  }

  .dark .ant-card-head-title,
  .dark .ant-card-extra {
    color: var(--dark-color-text-primary);
  }

  .dark .ant-table {
    background-color: var(--dark-color-surface-100);
    color: var(--dark-color-text-primary);
  }

  .dark .ant-table-thead>tr>th {
    background-color: var(--dark-color-background);
    color: var(--dark-color-text-primary);
    border-bottom-color: var(--dark-color-surface-400);
  }

  .dark .ant-table-tbody>tr>td {
    border-bottom-color: var(--dark-color-surface-400);
    color: var(--dark-color-text-primary);
  }

  .dark .ant-table-bordered .ant-table-body>table,
  .dark .ant-table-bordered .ant-table-fixed-left table,
  .dark .ant-table-bordered .ant-table-fixed-right table,
  .dark .ant-table-bordered .ant-table-header>table {
    border-color: var(--dark-color-surface-400);
  }

  .dark .ant-table-bordered .ant-table-tbody>tr>td,
  .dark .ant-table-bordered .ant-table-thead>tr>th {
    border-color: var(--dark-color-surface-400);
  }

  .dark .ant-alert-info {
    background-color: rgba(24, 144, 255, 0.15);
    border-color: rgba(24, 144, 255, 0.3);
  }

  .dark .ant-alert-info .ant-alert-message,
  .dark .ant-alert-info .ant-alert-description {
    color: var(--dark-color-text-primary);
  }

  .dark .ant-tag {
    color: var(--dark-color-text-primary);
    background-color: var(--dark-color-tag-bg);
    border-color: var(--dark-color-tag-border);
  }

  .dark .ant-tag-green {
    background-color: rgba(var(--dark-color-tag-green-bg));
    border-color: rgba(var(--dark-color-tag-green-border));
    color: var(--dark-color-tag-green-color);
  }

  .dark .ant-tag-blue {
    background-color: var(--dark-color-tag-blue-bg);
    border-color: var(--dark-color-tag-blue-border);
    color: var(--dark-color-tag-blue-color);
  }

  /* Ensure consistent spacing */
  #content-layout .ant-layout-content {
    padding: 16px;
  }

  /* API endpoint card styling */
  .api-endpoint-card .ant-card-body {
    padding: 0;
  }

  .api-endpoint-card .ant-table-wrapper {
    margin: 0;
  }

  /* Fix table borders - clean and consistent */
  .api-endpoint-card .ant-table-bordered {
    border-radius: 1rem;
    overflow: hidden;
  }

  .api-endpoint-card .ant-table-bordered .ant-table-body>table {
    border: 1px solid #e8e8e8;
    border-radius: 1rem;
  }

  .dark .api-endpoint-card .ant-table-bordered .ant-table-body>table {
    border-color: var(--dark-color-surface-400);
  }

  .api-endpoint-card .ant-table-bordered .ant-table-thead>tr>th,
  .api-endpoint-card .ant-table-bordered .ant-table-tbody>tr>td {
    border-right: 1px solid #e8e8e8;
  }

  .dark .api-endpoint-card .ant-table-bordered .ant-table-thead>tr>th,
  .dark .api-endpoint-card .ant-table-bordered .ant-table-tbody>tr>td {
    border-right-color: var(--dark-color-surface-400);
  }

  .api-endpoint-card .ant-table-bordered .ant-table-thead>tr>th:last-child,
  .api-endpoint-card .ant-table-bordered .ant-table-tbody>tr>td:last-child {
    border-right: none;
  }

  .api-endpoint-card .ant-table-bordered .ant-table-tbody>tr:last-child>td {
    border-bottom: none;
  }

  /* Mobile responsiveness */
  @media (max-width: 768px) {
    #content-layout .ant-layout-content {
      padding: 8px;
    }
  }
</style>

{{ template "page/body_start" .}}
<a-layout id="app" v-cloak :class="themeSwitcher.currentTheme + ' api-endpoints-page'">
  <a-sidebar></a-sidebar>
  <a-layout id="content-layout">
    <a-layout-content>
      <a-spin :spinning="loading" :delay="500" tip='{{ i18n "loading"}}'>
        <!-- Page Load Animation -->
        <transition name="list" appear>
          <div>
            <!-- Security Alerts -->
            <a-alert
              v-if="confAlerts.length > 0"
              type="error"
              :style="{ marginBottom: '16px' }"
              message='{{ i18n "secAlertTitle" }}'
              color="red"
              show-icon
              closable
            >
              <template slot="description">
                <b>{{ i18n "secAlertConf" }}</b>
                <ul style="margin: 8px 0 0 20px; padding: 0;">
                  <li v-for="a in confAlerts" :key="a" style="margin-bottom: 2px;">[[ a ]]</li>
                </ul>
              </template>
            </a-alert>

            <!-- Main Content -->
            <a-row :gutter="[16,16]">
              <a-col :span="24">
                <a-card hoverable>
                  <template #title>
                    <a-space>
                      <a-icon type="api" />
                      <span>{{ i18n "pages.apiEndpoints.title" }}</span>
                    </a-space>
                  </template>
                  <template #extra>
                    <a-tag color="green">v{{ .cur_ver }}</a-tag>
                  </template>

                  <a-row :gutter="[16,16]">
                    <!-- Info Alert -->
                    <a-col :span="24">
                      <a-alert
                        message="API Endpoints"
                        description='{{ i18n "pages.apiEndpoints.apiEndpointsDescription" }}'
                        type="info"
                        show-icon
                        :style="{ marginBottom: '16px' }"
                      />
                    </a-col>

                    <!-- Routing API Section - JSON-based endpoints -->
                    <a-col :span="24">
                      <a-card
                        size="small"
                        title='{{ i18n "pages.apiEndpoints.routing.title" }}'
                        class="api-endpoint-card"
                        :style="{ marginBottom: '16px' }"
                      >
                        <a-table
                          :columns="routingColumns"
                          :data-source="routingEndpoints"
                          :pagination="false"
                          bordered
                          :locale='{ filterConfirm: `{{ i18n "confirm" }}`, filterReset: `{{ i18n "reset" }}`, emptyText: `{{ i18n "noData" }}` }'
                        >
                          <template slot="method" slot-scope="text">
                            <a-tag :color="getMethodColor(text)" style="font-weight: bold;">[[ text ]]</a-tag>
                          </template>
                          <template slot="description" slot-scope="text">
                            <span v-html="text"></span>
                          </template>
                        </a-table>
                      </a-card>
                    </a-col>

                    <!-- Inbound API Section -->
                    <a-col :span="24">
                      <a-card
                        size="small"
                        title='{{ i18n "pages.apiEndpoints.inbound.title" }}'
                        class="api-endpoint-card"
                        :style="{ marginBottom: '16px' }"
                      >
                        <a-table
                          :columns="inboundColumns"
                          :data-source="inboundEndpoints"
                          :pagination="false"
                          bordered
                          :locale='{ filterConfirm: `{{ i18n "confirm" }}`, filterReset: `{{ i18n "reset" }}`, emptyText: `{{ i18n "noData" }}` }'
                        >
                          <template slot="method" slot-scope="text">
                            <a-tag :color="getMethodColor(text)" style="font-weight: bold;">[[ text ]]</a-tag>
                          </template>
                          <template slot="description" slot-scope="text">
                            <span v-html="text"></span>
                          </template>
                        </a-table>
                      </a-card>
                    </a-col>

                    <!-- Server API Section -->
                    <a-col :span="24">
                      <a-card
                        size="small"
                        title='{{ i18n "pages.apiEndpoints.server.title" }}'
                        class="api-endpoint-card"
                        :style="{ marginBottom: '16px' }"
                      >
                        <a-table
                          :columns="serverColumns"
                          :data-source="serverEndpoints"
                          :pagination="false"
                          bordered
                          :locale='{ filterConfirm: `{{ i18n "confirm" }}`, filterReset: `{{ i18n "reset" }}`, emptyText: `{{ i18n "noData" }}` }'
                        >
                          <template slot="method" slot-scope="text">
                            <a-tag :color="getMethodColor(text)" style="font-weight: bold;">[[ text ]]</a-tag>
                          </template>
                          <template slot="description" slot-scope="text">
                            <span v-html="text"></span>
                          </template>
                        </a-table>
                      </a-card>
                    </a-col>

                    <!-- Setting API Section -->
                    <a-col :span="24">
                      <a-card
                        size="small"
                        title='{{ i18n "pages.apiEndpoints.setting.title" }}'
                        class="api-endpoint-card"
                        :style="{ marginBottom: '16px' }"
                      >
                        <a-table
                          :columns="settingColumns"
                          :data-source="settingEndpoints"
                          :pagination="false"
                          bordered
                          :locale='{ filterConfirm: `{{ i18n "confirm" }}`, filterReset: `{{ i18n "reset" }}`, emptyText: `{{ i18n "noData" }}` }'
                        >
                          <template slot="method" slot-scope="text">
                            <a-tag :color="getMethodColor(text)" style="font-weight: bold;">[[ text ]]</a-tag>
                          </template>
                          <template slot="description" slot-scope="text">
                            <span v-html="text"></span>
                          </template>
                        </a-table>
                      </a-card>
                    </a-col>
                  </a-row>
                </a-card>
              </a-col>
            </a-row>
          </div>
        </transition>
      </a-spin>
    </a-layout-content>
  </a-layout>
</a-layout>

<script>
  const app = new Vue({
    delimiters: ['[[', ']]'],
    el: '#app',
    mixins: [MediaQueryMixin],
    data: {
      themeSwitcher,
      loading: false,
      confAlerts: [],
      routingColumns: [
        { title: 'Method', dataIndex: 'method', width: '100px', scopedSlots: { customRender: 'method' } },
        { title: 'Endpoint', dataIndex: 'endpoint' },
        { title: 'Description', dataIndex: 'description', scopedSlots: { customRender: 'description' } }
      ],
      inboundColumns: [
        { title: 'Method', dataIndex: 'method', width: '100px', scopedSlots: { customRender: 'method' } },
        { title: 'Endpoint', dataIndex: 'endpoint' },
        { title: 'Description', dataIndex: 'description', scopedSlots: { customRender: 'description' } }
      ],
      serverColumns: [
        { title: 'Method', dataIndex: 'method', width: '100px', scopedSlots: { customRender: 'method' } },
        { title: 'Endpoint', dataIndex: 'endpoint' },
        { title: 'Description', dataIndex: 'description', scopedSlots: { customRender: 'description' } }
      ],
      settingColumns: [
        { title: 'Method', dataIndex: 'method', width: '100px', scopedSlots: { customRender: 'method' } },
        { title: 'Endpoint', dataIndex: 'endpoint' },
        { title: 'Description', dataIndex: 'description', scopedSlots: { customRender: 'description' } }
      ],
      // JSON-based Routing API Endpoints
      routingEndpoints: [
          { method: 'GET', endpoint: '/panel/api/routing/rules', description: '{{ i18n "pages.apiEndpoints.routing.getAllRules" }}' },
          { method: 'GET', endpoint: '/panel/api/routing/rules/:index', description: '{{ i18n "pages.apiEndpoints.routing.getRule" }}' },
          { method: 'POST', endpoint: '/panel/api/routing/rules', description: '{{ i18n "pages.apiEndpoints.routing.addRule" }}' },
          { method: 'PUT', endpoint: '/panel/api/routing/rules/:index', description: '{{ i18n "pages.apiEndpoints.routing.updateRule" }}' },
          { method: 'DELETE', endpoint: '/panel/api/routing/rules/:index', description: '{{ i18n "pages.apiEndpoints.routing.deleteRule" }}' },
          { method: 'POST', endpoint: '/panel/api/routing/rules/:index/users', description: '{{ i18n "pages.apiEndpoints.routing.updateRuleUsers" }}' },
          { method: 'DELETE', endpoint: '/panel/api/routing/rules/all', description: '{{ i18n "pages.apiEndpoints.routing.deleteAllRules" }}' }
      ],
      inboundEndpoints: [
        { method: 'GET', endpoint: '/panel/api/inbounds/list', description: '{{ i18n "pages.apiEndpoints.inbound.getAll" }}' },
        { method: 'GET', endpoint: '/panel/api/inbounds/get/:id', description: '{{ i18n "pages.apiEndpoints.inbound.getById" }}' },
        { method: 'POST', endpoint: '/panel/api/inbounds/add', description: '{{ i18n "pages.apiEndpoints.inbound.create" }}' },
        { method: 'POST', endpoint: '/panel/api/inbounds/update/:id', description: '{{ i18n "pages.apiEndpoints.inbound.update" }}' },
        { method: 'POST', endpoint: '/panel/api/inbounds/del/:id', description: '{{ i18n "pages.apiEndpoints.inbound.delete" }}' },
        { method: 'POST', endpoint: '/panel/api/inbounds/addClient', description: '{{ i18n "pages.apiEndpoints.inbound.addClient" }}' },
        { method: 'POST', endpoint: '/panel/api/inbounds/:id/delClient/:clientId', description: '{{ i18n "pages.apiEndpoints.inbound.delClient" }}' },
        { method: 'POST', endpoint: '/panel/api/inbounds/updateClient/:clientId', description: '{{ i18n "pages.apiEndpoints.inbound.updateClient" }}' },
        { method: 'POST', endpoint: '/panel/api/inbounds/resetAllTraffics', description: '{{ i18n "pages.apiEndpoints.inbound.resetTraffic" }}' }
      ],
      serverEndpoints: [
        { method: 'GET', endpoint: '/panel/api/server/status', description: '{{ i18n "pages.apiEndpoints.server.status" }}' },
        { method: 'POST', endpoint: '/panel/api/server/stopXrayService', description: '{{ i18n "pages.apiEndpoints.server.stopXray" }}' },
        { method: 'POST', endpoint: '/panel/api/server/restartXrayService', description: '{{ i18n "pages.apiEndpoints.server.restartXray" }}' },
        { method: 'POST', endpoint: '/panel/api/server/installXray/:version', description: '{{ i18n "pages.apiEndpoints.server.installXray" }}' },
        { method: 'GET', endpoint: '/panel/api/server/getConfigJson', description: '{{ i18n "pages.apiEndpoints.server.getConfig" }}' },
        { method: 'GET', endpoint: '/panel/api/server/getDb', description: '{{ i18n "pages.apiEndpoints.server.getDb" }}' },
        { method: 'GET', endpoint: '/panel/api/server/getNewUUID', description: '{{ i18n "pages.apiEndpoints.server.getNewUUID" }}' },
        { method: 'GET', endpoint: '/panel/api/server/getNewX25519Cert', description: '{{ i18n "pages.apiEndpoints.server.getNewX25519" }}' }
      ],
      settingEndpoints: [
        { method: 'POST', endpoint: '/panel/setting/all', description: '{{ i18n "pages.apiEndpoints.setting.getAll" }}' },
        { method: 'POST', endpoint: '/panel/setting/update', description: '{{ i18n "pages.apiEndpoints.setting.update" }}' },
        { method: 'POST', endpoint: '/panel/setting/updateUser', description: '{{ i18n "pages.apiEndpoints.setting.updateUser" }}' },
        { method: 'POST', endpoint: '/panel/setting/restartPanel', description: '{{ i18n "pages.apiEndpoints.setting.restartPanel" }}' },
        { method: 'GET', endpoint: '/panel/setting/getDefaultJsonConfig', description: '{{ i18n "pages.apiEndpoints.setting.getDefaultConfig" }}' }
      ]
    },
    mounted() {
      this.confAlerts = this.getConfAlerts();
    },
    methods: {
      getMethodColor(method) {
        const colors = {
          'GET': 'green',
          'POST': 'blue',
          'PUT': 'orange',
          'DELETE': 'red',
          'PATCH': 'purple'
        };
        return colors[method] || 'default';
      },
      getConfAlerts() {
        var alerts = [];
        if (window.location.protocol !== "https:") {
          alerts.push('{{ i18n "secAlertSSL" }}');
        }
        const currentPort = window.location.port;
        if (currentPort === '2053') {
          alerts.push('{{ i18n "secAlertPanelPort" }}');
        }
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        if (pathSegments.length < 3) {
          alerts.push('{{ i18n "secAlertPanelURI" }}');
        }
        return alerts;
      }
    }
  });
</script>

{{ template "page/body_end" .}}
