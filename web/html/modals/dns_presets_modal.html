{{define "modals/dnsPresetsModal"}}
<a-modal id="dnsPresets-modal" v-model="dnsPresetsModal.visible" :title="dnsPresetsModal.title" :closable="true"
  :mask-closable="false" :footer="null" :class="themeSwitcher.currentTheme">
  <a-list class="ant-dns-presets-list" bordered :style="{ width: '100%' }">
    <a-list-item v-for="dns in dnsPresetsDatabase" :style="{ padding: '12px 16px' }">
      <div class="ant-dns-presets-line">

        <!-- LEFT SIDE: Tag + Protocol + Name -->
        <div class="ant-dns-presets-info">
          <!-- 1. TAG -->
          <a-tag :color="dns.family ? 'purple' : (dns.malware ? 'red' : (dns.ads ? 'orange' : 'green'))">
            [[ dns.family ? 'Family' : (dns.malware ? 'Malware' : (dns.ads ? 'Ads' : 'DNS')) ]]
          </a-tag>

          <!-- 2. PROTOCOL -->
          <a-tag
            v-if="dns.protocol"
            :color="dns.protocol === 'DoQ'
              ? 'blue'
              : (dns.protocol === 'DoH'
                ? 'cyan'
                : (dns.protocol === 'DoH+DoQ'
                  ? 'geekblue'
                  : 'green'))"
            size="small">
            [[ dns.protocol ]]
          </a-tag>

          <!-- 3. NAME -->
          <span class="ant-dns-presets-list-name">
            [[ dns.name ]]
          </span>
        </div>

        <!-- RIGHT SIDE: Install Button -->
        <a-button
          class="ant-dns-presets-install"
          type="primary"
          @click="dnsPresetsModal.install(dns.data)">
          Install
        </a-button>

      </div>
    </a-list-item>
  </a-list>
</a-modal>

<style>
  .ant-dns-presets-line {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    flex-wrap: wrap;
  }

  .ant-dns-presets-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ant-dns-presets-list-name {
    font-weight: 500;
  }

  .ant-dns-presets-install {
    margin-left: auto;
  }

  .dark .ant-dns-presets-list {
    border-color: var(--dark-color-stroke);
  }

  .dark .ant-dns-presets-list-name {
    color: var(--dark-color-text-primary);
  }

  /* Mobile Responsive */
  @media (max-width: 576px) {
    .ant-dns-presets-line {
      gap: 4px;
    }
    .ant-dns-presets-info {
      gap: 4px;
    }
    .ant-dns-presets-install {
      margin-left: 0;
      width: 100%;
      margin-top: 4px;
    }
  }
</style>
